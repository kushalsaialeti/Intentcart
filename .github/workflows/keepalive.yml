name: IntentCart Keep-Alive Cron

on:
  schedule:
    # Runs every 10 minutes (Render free instances sleep after 15m of inactivity)
    # 10m provides a 5m safety buffer against GitHub Actions queue delays
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping IntentCart Backend Health Endpoint
        run: |
          TARGET_URL="${{ secrets.RENDER_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://intentcart-zg5o.onrender.com"
          fi
          
          # Strip trailing slash
          TARGET_URL="${TARGET_URL%/}"
          
          echo "Pinging ${TARGET_URL}/api/health ..."
          # Uses lightweight HEAD request (-I) for zero payload overhead and instant response
          HTTP_CODE=$(curl -s -I -o /dev/null -w "%{http_code}" "${TARGET_URL}/api/health")
          echo "HTTP Status Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 301 ] || [ "$HTTP_CODE" -eq 302 ]; then
            echo "SUCCESS: Backend is warm, active, and healthy."
          else
            echo "WARNING: Backend returned status $HTTP_CODE. Retrying with GET..."
            HTTP_CODE_GET=$(curl -s -o /dev/null -w "%{http_code}" "${TARGET_URL}/api/health")
            echo "GET Status Code: $HTTP_CODE_GET"
          fi
